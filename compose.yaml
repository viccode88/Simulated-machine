# 簡化火力發電廠工業控制模擬器（設備自持 + OpenPLC）
#
#   cp .env.example .env
#   docker compose up --build                        # 預設：8 台自持設備 + OpenPLC v4 + HMI
#   COMPOSE_PROFILES=openplc-v3 docker compose up    # 改用 OpenPLC v3 Runtime
#   COMPOSE_PROFILES=no-plc docker compose up        # 完全不啟動 PLC（設備照樣自己運轉）
#
# 八台設備是「自持」的：環境條件成立就自行啟動，並由設備本地的調節器把
# 程序量維持在可運行範圍。PLC 只做資料交換與邏輯判斷，SCADA 只負責啟停與觀察，
# 因此沒有 PLC 時機組仍會自己併聯發電。
#
# .env 的 COMPOSE_PROFILES 決定啟動哪一種 PLC，預設 openplc-v4。
# 注意：命令列的 `--profile` 是疊加在 COMPOSE_PROFILES 之上，不是取代；
# 同時帶起 openplc-v3 與 openplc-v4 會搶同一個主機埠。

x-device: &device
  build:
    context: .
    dockerfile: Dockerfile
  image: thermal-plant-simulator:latest
  restart: ${DEVICE_RESTART:-unless-stopped}
  environment: &device-env
    LAB_MODE: ${LAB_MODE:-false}
    MODBUS_TRACE: ${MODBUS_TRACE:-false}
    SELF_HOLD: ${SELF_HOLD:-true}
    SIM_BUS_HOST: plant-bus
    SIM_BUS_PORT: "7000"
    CONFIG_DIR: /app/configs
    STATE_DIR: /var/lib/plant-device
    TZ: ${TZ:-Asia/Taipei}
  depends_on:
    plant-bus:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-m", "tools.healthcheck", "modbus", "127.0.0.1", "502"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 15s

networks:
  control_net:      # Modbus TCP：外部 PLC / HMI / 測試工具 / 封包擷取
    name: plant_control_net
  sim_net:          # 設備之間的物理量交換（外部 PLC 不應直接使用）
    name: plant_sim_net
    internal: true
  management_net:   # metrics / 日誌 / 歷史資料 / 健康檢查
    name: plant_management_net

volumes:
  plant-bus-state:
  condenser-state:
  condensate-pump-state:
  feedwater-tank-state:
  feedwater-pump-state:
  boiler-state:
  steam-valve-state:
  turbine-state:
  generator-state:
  historian-data:
  openplc-v3-data:
  openplc-v4-data:

services:
  # ---------------------------------------------------------------- plant-bus
  plant-bus:
    build:
      context: .
      dockerfile: Dockerfile
    image: thermal-plant-simulator:latest
    container_name: plant-bus
    command: ["python", "-m", "plant_bus.app.main"]
    restart: ${DEVICE_RESTART:-unless-stopped}
    environment:
      CONFIG_DIR: /app/configs
      STATE_DIR: /var/lib/plant-bus
      HTTP_PORT: "8080"
      RESTORE_ON_BOOT: ${RESTORE_ON_BOOT:-}
      RESTORE_ON_BOOT_DELAY: ${RESTORE_ON_BOOT_DELAY:-5}
      TZ: ${TZ:-Asia/Taipei}
    networks: [sim_net, management_net]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:15080:8080"   # 快照 / 模擬控制 / metrics API
    volumes:
      - plant-bus-state:/var/lib/plant-bus
    healthcheck:
      test: ["CMD", "python", "-m", "tools.healthcheck", "http", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ---------------------------------------------------------------- 設備
  condenser:
    <<: *device
    container_name: condenser
    command: ["python", "-m", "devices.condenser.main"]
    networks: [control_net, sim_net]
    ports: ["${BIND_ADDR:-127.0.0.1}:15021:502"]
    volumes: [condenser-state:/var/lib/plant-device]

  condensate-pump:
    <<: *device
    container_name: condensate-pump
    command: ["python", "-m", "devices.condensate_pump.main"]
    networks: [control_net, sim_net]
    ports: ["${BIND_ADDR:-127.0.0.1}:15022:502"]
    volumes: [condensate-pump-state:/var/lib/plant-device]

  feedwater-tank:
    <<: *device
    container_name: feedwater-tank
    command: ["python", "-m", "devices.feedwater_tank.main"]
    networks: [control_net, sim_net]
    ports: ["${BIND_ADDR:-127.0.0.1}:15023:502"]
    volumes: [feedwater-tank-state:/var/lib/plant-device]

  feedwater-pump:
    <<: *device
    container_name: feedwater-pump
    command: ["python", "-m", "devices.feedwater_pump.main"]
    networks: [control_net, sim_net]
    ports: ["${BIND_ADDR:-127.0.0.1}:15024:502"]
    volumes: [feedwater-pump-state:/var/lib/plant-device]

  boiler:
    <<: *device
    container_name: boiler
    command: ["python", "-m", "devices.boiler.main"]
    networks: [control_net, sim_net]
    ports: ["${BIND_ADDR:-127.0.0.1}:15025:502"]
    volumes: [boiler-state:/var/lib/plant-device]

  steam-valve:
    <<: *device
    container_name: steam-valve
    command: ["python", "-m", "devices.steam_valve.main"]
    networks: [control_net, sim_net]
    ports: ["${BIND_ADDR:-127.0.0.1}:15026:502"]
    volumes: [steam-valve-state:/var/lib/plant-device]

  turbine:
    <<: *device
    container_name: turbine
    command: ["python", "-m", "devices.turbine.main"]
    networks: [control_net, sim_net]
    ports: ["${BIND_ADDR:-127.0.0.1}:15027:502"]
    volumes: [turbine-state:/var/lib/plant-device]

  generator:
    <<: *device
    container_name: generator
    command: ["python", "-m", "devices.generator.main"]
    networks: [control_net, sim_net]
    ports: ["${BIND_ADDR:-127.0.0.1}:15028:502"]
    volumes: [generator-state:/var/lib/plant-device]

  # ---------------------------------------------------------------- PLC
  # PLC 只做資料交換與邏輯判斷：南向輪詢八台設備、北向提供單一 Modbus server
  # 給 SCADA/HMI，並執行 watchdog、脈衝展寬與跳機矩陣。它不計算任何控制輸出。
  #
  # v4：ghcr.io/autonomy-logic/openplc-runtime，程式由 OpenPLC Editor v4 透過
  #     8443 REST API 部署（容器本身沒有網頁介面）。
  # v3：官方沒有發佈映像，預設由 integrations/openplc/docker/Dockerfile.v3
  #     自 GitHub 原始碼建置；已有映像時用 .env 的 OPENPLC_V3_IMAGE 指定即可。
  openplc-v4:
    image: ${OPENPLC_V4_IMAGE:-ghcr.io/autonomy-logic/openplc-runtime:latest}
    container_name: openplc-v4
    profiles: ["openplc-v4"]
    restart: ${DEVICE_RESTART:-unless-stopped}
    cap_add: [SYS_NICE, SYS_RESOURCE]
    environment:
      TZ: ${TZ:-Asia/Taipei}
    networks: [control_net, management_net]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PLC_MODBUS_PORT:-15020}:502"   # 北向 Modbus server
      - "${BIND_ADDR:-127.0.0.1}:15443:8443"                      # Editor v4 部署用 REST API
    volumes:
      - openplc-v4-data:/var/run/runtime
      # 專案原始碼（唯讀）：用 OpenPLC Editor 開啟同一份目錄後編譯部署
      - ./integrations/openplc/thermal-plant-v4:/projects/thermal-plant-v4:ro
    depends_on:
      boiler: {condition: service_started}
      turbine: {condition: service_started}
      generator: {condition: service_started}

  openplc-v3:
    image: ${OPENPLC_V3_IMAGE:-thermal-plant-openplc-v3:latest}
    build:
      context: ./integrations/openplc/docker
      dockerfile: Dockerfile.v3
      args:
        OPENPLC_V3_REF: ${OPENPLC_V3_REF:-master}
    container_name: openplc-v3
    profiles: ["openplc-v3"]
    restart: ${DEVICE_RESTART:-unless-stopped}
    privileged: ${OPENPLC_V3_PRIVILEGED:-false}
    environment:
      TZ: ${TZ:-Asia/Taipei}
    networks: [control_net, management_net]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PLC_MODBUS_PORT:-15020}:502"   # 北向 Modbus server
      - "${BIND_ADDR:-127.0.0.1}:15083:8080"                      # v3 網頁介面（openplc/openplc）
    volumes:
      - openplc-v3-data:/opt/OpenPLC_v3/webserver/st_files
      - ./integrations/openplc/thermal-plant-v3:/projects/thermal-plant-v3:ro
    depends_on:
      boiler: {condition: service_started}
      turbine: {condition: service_started}
      generator: {condition: service_started}

  # ---------------------------------------------------------------- 觀測
  historian:
    build:
      context: .
      dockerfile: Dockerfile
    image: thermal-plant-simulator:latest
    container_name: historian
    command: ["python", "-m", "historian.main"]
    restart: ${DEVICE_RESTART:-unless-stopped}
    environment:
      SIM_BUS_HOST: plant-bus
      SIM_BUS_PORT: "7000"
      STATE_DIR: /var/lib/historian
      HTTP_PORT: "8081"
      TZ: ${TZ:-Asia/Taipei}
    networks: [sim_net, management_net]
    ports: ["${BIND_ADDR:-127.0.0.1}:15081:8081"]
    volumes: [historian-data:/var/lib/historian]
    depends_on:
      plant-bus: {condition: service_healthy}

  hmi:
    build:
      context: .
      dockerfile: Dockerfile
    image: thermal-plant-simulator:latest
    container_name: hmi
    command: ["python", "-m", "hmi.main"]
    restart: ${DEVICE_RESTART:-unless-stopped}
    environment:
      BUS_API: http://plant-bus:8080
      HISTORIAN_API: http://historian:8081
      HTTP_PORT: "8082"
      TZ: ${TZ:-Asia/Taipei}
    networks: [management_net]
    ports: ["${BIND_ADDR:-127.0.0.1}:15082:8082"]
    depends_on:
      plant-bus: {condition: service_healthy}
