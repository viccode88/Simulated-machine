# 模糊測試環境覆蓋檔
#
#   docker compose -f compose.yaml -f compose.fuzz.yaml --profile fuzz up --build
#
# 特性：
#   * LAB_MODE=true 才會開放故障注入區域
#   * Modbus 詳細封包日誌（每筆 request/response/exception/latency）
#   * 關閉自動 restart，讓崩潰可被 harness 觀察（exit code / stack trace）
#   * 保留 core dump
#   * 每次測試前由 harness 還原相同 plant snapshot，不需重啟容器

x-fuzz-device: &fuzz-device
  restart: "no"
  ulimits:
    core: -1
  environment:
    LAB_MODE: "true"
    MODBUS_TRACE: "true"
    PYTHONFAULTHANDLER: "1"
    SIM_BUS_HOST: plant-bus
    SIM_BUS_PORT: "7000"
    CONFIG_DIR: /app/configs
    STATE_DIR: /var/lib/plant-device
  volumes:
    - fuzz-artifacts:/var/lib/crash

volumes:
  fuzz-artifacts:

services:
  plant-bus:
    restart: "no"
    environment:
      CONFIG_DIR: /app/configs
      STATE_DIR: /var/lib/plant-bus
      HTTP_PORT: "8080"
      LAB_MODE: "true"

  condenser:
    <<: *fuzz-device
  condensate-pump:
    <<: *fuzz-device
  feedwater-tank:
    <<: *fuzz-device
  feedwater-pump:
    <<: *fuzz-device
  boiler:
    <<: *fuzz-device
  steam-valve:
    <<: *fuzz-device
  turbine:
    <<: *fuzz-device
  generator:
    <<: *fuzz-device

  fuzzer:
    build:
      context: .
      dockerfile: Dockerfile
    image: thermal-plant-simulator:latest
    container_name: fuzzer
    profiles: ["fuzz"]
    command:
      - python
      - -m
      - tools.fuzz.harness
      - --duration
      - "${FUZZ_DURATION:-300}"
    restart: "no"
    environment:
      BUS_API: http://plant-bus:8080
      TARGETS: "${FUZZ_TARGETS:-boiler:502,turbine:502,steam-valve:502,generator:502}"
      BASELINE_SNAPSHOT: "${FUZZ_BASELINE:-fuzz-baseline}"
      RATE_LIMIT: "${FUZZ_RATE:-200}"
      ARTIFACT_DIR: /var/lib/crash
      TZ: "${TZ:-Asia/Taipei}"
    networks: [control_net, management_net]
    volumes:
      - fuzz-artifacts:/var/lib/crash
    depends_on:
      plant-bus:
        condition: service_healthy
