[project]
name = "thermal-plant-simulator"
version = "3.0.0"
description = "簡化火力發電廠工業控制模擬器（Modbus TCP / 容器化 / 可注入故障）"
requires-python = ">=3.11"
dependencies = [
    # pymodbus 文件明確提醒版本不完全遵循 SemVer，因此固定精確版本
    "pymodbus==3.14.0",
    "PyYAML==6.0.2",
    "aiohttp==3.10.11",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
]

[project.scripts]
plantctl = "tools.plantctl:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["common*", "devices*", "controller*", "plant_bus*", "historian*", "hmi*", "tools*"]
