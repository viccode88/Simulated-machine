boiler:
  mass_min_kg: 20000        # 水位 0%
  mass_max_kg: 50000        # 水位 100%（有效水量約 30,000 kg）
  initial_mass_kg: 40010    # 66.7%
  initial_pressure_bar: 1.0
  rated_steam_kg_s: 100.0
  tau_boiler_s: 20.0        # 15～30 秒
  k_pressure: 0.02          # bar/(kg/s)/s
  k_loss: 0.0002
  ambient_pressure_bar: 1.0
  k_swell: 0.15             # %/(kg/s)
  burner_up_rate_pct_s: 5.0
  burner_down_rate_pct_s: 10.0
  purge_time_s: 30.0
  ignition_time_s: 5.0
  min_fire_pct: 8.0
  min_turbine_pressure_bar: 30.0
  superheat_max_c: 190.0
  max_blowdown_kg_s: 2.0
  relief_setpoint_bar: 113.0     # 安全閥（超壓的第一道防線）
  relief_capacity_kg_s: 40.0
  blowdown_default_pct: 5.0

  # --- 本地自持控制（設備自己維持壓力，PLC 不參與調節） ---
  control:
    pressure:               # PV 汽包壓力 / SP 40010 / MV 燃燒器輸出
      # 壓力是積分型程序（dP/dt ∝ 蒸發量），積分作用必須很小，
      # 否則會出現週期約 180 秒的振盪：壓力衝到安全閥、洩汽再把水位打亂。
      kp: 1.5
      ki: 0.01
      kd: 3.0
      out_min: 0.0
      out_max: 100.0
      rate_up: 5.0          # 5 %/s 上升
      rate_down: 10.0       # 10 %/s 下降
      deadband: 0.2
      integral_limit: 100.0
    startup_burner_max_pct: 20.0     # 升壓期間燃燒器上限
    ramp_release_steam_kg_s: 25.0    # 抽汽超過此值視為帶載，解除升壓限幅
    runback_pressure_bar: 108.0      # 高壓 runback：達此壓力立即切燃料（＝高壓警報門檻）
    runback_rate_pct_s: 100.0        # runback 時的燃料下降速率（正常為 10 %/s）

comm:
  # 自持設備：失去 PLC 通訊不改變本地控制（燃燒器仍由本地壓力調節器維持）
  failure_policy: LOCAL_AUTO

protections:
  LOW_LOW_LEVEL:
    alarm: 30.0
    trip: 20.0
    delay: 2.0
    reset: 30.0
    reset_delay: 5.0
  HIGH_HIGH_LEVEL:
    alarm: 85.0
    trip: 90.0
    delay: 2.0
    reset: 80.0
    reset_delay: 5.0
  HIGH_PRESSURE:
    alarm: 108.0
    trip: 115.0
    delay: 1.0
    reset: 105.0
    reset_delay: 5.0
  FLAME_FAILURE:
    alarm: 0.5
    trip: 0.5
    delay: 1.0
    reset: 0.5
    reset_delay: 3.0
