generator:
  rated_mw: 100.0
  rated_kv: 15.75
  rated_power_factor: 0.85
  grid_frequency_hz: 50.0
  grid_stiffness_mw_per_rpm: 2.0
  load_tau_s: 0.5
  # 加載速率：孤島模式下電氣功率直接加在軸上，加載太快轉速控制跟不上。
  # 2.0 MW/s（0→60 MW 只要 30 秒）實測會在併聯後 22 秒觸發欠頻跳機。
  load_rate_mw_s: 0.5
  default_mode: 0                 # 0 = 孤島（預設），1 = 強電網
  sync_speed_band_rpm: 30.0
  sync_frequency_band_hz: [49.5, 50.5]
  sync_voltage_band_pct: [95.0, 105.0]
  sync_angle_limit_deg: 10.0

comm:
  failure_policy: HOLD_LAST
  breaker_open_after_s: 10.0

protections:
  OVERCURRENT:
    alarm: 1.05
    trip: 1.2
    delay: 2.0
    reset: 1.0
    reset_delay: 5.0
  OVERFREQUENCY:
    alarm: 51.0
    trip: 52.0
    delay: 1.0
    reset: 50.5
    reset_delay: 5.0
  UNDERFREQUENCY:
    alarm: 48.5
    trip: 47.5
    delay: 1.0
    reset: 49.5
    reset_delay: 5.0
  REVERSE_POWER:
    alarm: 0.5
    trip: 0.5
    delay: 3.0
    reset: 0.5
    reset_delay: 5.0
