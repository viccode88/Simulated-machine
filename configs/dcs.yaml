dcs:
  auto_start: true
  start_delay_s: 8.0
  poll_s: 0.25              # 快速 Modbus 掃描
  pid_scan_s: 0.5           # DCS PID 週期
  target_load_mw: 60.0
  overspeed_close_rpm: 3150.0
  startup_burner_max_pct: 20.0    # 升壓期間燃燒器上限
  startup_valve_max_pct: 15.0     # 升速期間主蒸汽閥上限
  port: 502
  hosts:
    condenser: condenser
    condensate_pump: condensate-pump
    feedwater_tank: feedwater-tank
    feedwater_pump: feedwater-pump
    boiler: boiler
    steam_valve: steam-valve
    turbine: turbine
    generator: generator
  loops:
    boiler_pressure:        # PV 鍋爐壓力 / SP 100 bar(a) / MV 燃燒器輸出
      kp: 2.0
      ki: 0.08
      kd: 0.0
      setpoint: 100.0
      out_min: 0.0
      out_max: 100.0
      rate_up: 5.0          # 5 %/s 上升
      rate_down: 10.0       # 10 %/s 下降
      integral_limit: 100.0
      deadband: 0.2
    boiler_level:           # 三元素：水位修正 + 蒸汽流量前饋 - 給水流量回授
      kp: 2.0
      ki: 0.05
      kd: 0.0
      setpoint: 66.7
      out_min: -50.0
      out_max: 50.0
      integral_limit: 50.0
      deadband: 0.3
      three_element: true
      feedforward_gain: 1.2
      flow_kp: 1.2
      flow_ki: 0.4
    tank_level:             # PV 給水槽水位 / SP 60% / MV 凝結水泵速度
      kp: 2.0
      ki: 0.05
      kd: 0.0
      setpoint: 60.0
      rate_up: 3.0
      rate_down: 3.0
      integral_limit: 100.0
      deadband: 0.5
    turbine_speed:          # PV 轉速 / SP 3000 RPM / MV 主蒸汽閥開度
      kp: 0.05
      ki: 0.005
      kd: 0.002
      setpoint: 3000.0
      rate_up: 20.0
      rate_down: 40.0
      integral_limit: 100.0
      deadband: 2.0
    load_control:           # 強電網模式：閥門控制有功功率
      kp: 0.5
      ki: 0.1
      kd: 0.0
      rate_up: 10.0
      rate_down: 20.0
      integral_limit: 100.0
