feedwater_pump:
  rated_flow_kg_s: 120.0
  shutoff_head_bar: 300.0     # 簡化模型參數：使 100% 轉速在 100 bar 鍋爐壓力下約 100 kg/s
  speed_rate_pct_s: 12.0
  min_speed_pct: 20.0
  rated_current_a: 900.0
  cavitation_level_low_pct: 12.0
  cavitation_level_ok_pct: 25.0
  cavitation_trip_time_s: 20.0
  vibration_base_mm_s: 1.2
  start_level_min_pct: 25.0
  has_outlet_valve: true

comm:
  failure_policy: HOLD_LAST
  hold_seconds: 2.0           # 保持 2 秒後降速

protections:
  LOW_LOW_SUCTION:
    alarm: 25.0
    trip: 15.0
    delay: 3.0
    reset: 25.0
    reset_delay: 5.0
  CAVITATION_TRIP:
    alarm: 10.0
    trip: 20.0
    delay: 0.5
    reset: 1.0
    reset_delay: 5.0
  MOTOR_OVERCURRENT:
    alarm: 1.1
    trip: 1.3
    delay: 2.0
    reset: 1.0
    reset_delay: 5.0
