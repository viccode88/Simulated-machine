name: normal_startup
description: |
  §19.1 正常穩態驗收。由冷態開始，設備自持啟動（不需要任何控制器介入），
  檢查各項驗收範圍。
speed: 5.0
steps:
  - expect_event: {event: SELF_START, within: 60}
  - expect: {signal: condenser.pressure_bar_abs, min: 0.03, max: 0.10, within: 900, hold: 5}
  - expect: {signal: boiler.pressure_bar_abs, min: 90.0, max: 104.0, within: 1800, hold: 10}
  - expect: {signal: boiler.level_pct, min: 60.0, max: 72.0, within: 300, hold: 10}
  - expect: {signal: feedwater_tank.level_pct, min: 50.0, max: 70.0, within: 300, hold: 10}
  - expect: {signal: turbine.speed_rpm, min: 2980, max: 3020, within: 600, hold: 10}
  - expect: {signal: generator.electrical_power_mw, min: 57.0, max: 63.0, within: 900, hold: 10}
  - check_invariants: {}
  - snapshot_save: {name: steady-60mw, description: "60 MW 穩態基準（設備自持）"}
